<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LangChain Lab · 웹 채팅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#ecf3ff;font-family:system-ui,"Noto Sans KR",sans-serif}
.app{max-width:950px;height:100dvh;margin:auto;display:flex;flex-direction:column}
header,footer{padding:16px 20px;border-bottom:1px solid #334155}footer{border-bottom:0;border-top:1px solid #334155}
h1{font-size:20px;margin:0 0 6px}small{color:#a3b2ca}#status{color:#93c5fd;margin-top:9px}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:13px 16px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.user{background:#1d4ed8;align-self:flex-end}.ai{background:#233149;align-self:flex-start}
form{display:flex;gap:9px}textarea{flex:1;min-width:0;background:#1f2937;color:white;border:1px solid #475569;border-radius:9px;padding:12px;font:inherit;resize:none}
button{background:#2563eb;border:0;color:white;border-radius:9px;padding:12px;cursor:pointer}button:disabled{opacity:.5}
nav{display:flex;gap:8px;margin-top:12px}nav button{background:#334155}
</style>
</head>
<body>
<div class="app">
<header><h1>LangChain 웹 채팅</h1><small>GitHub Pages 화면 → 내 PC FastAPI/LangChain → LM Studio</small>
<nav><button id="check" type="button">서버 연결 확인</button><button id="reset" type="button">새 대화</button></nav>
<div id="status" role="status">서버 연결 확인 중...</div>
</header>
<section id="chat" aria-live="polite"><div class="msg ai">LangChain에 연결한 뒤 질문을 입력하세요.</div></section>
<footer><form id="form"><textarea id="question" rows="2" placeholder="질문 입력 · Enter 전송 / Shift+Enter 줄바꿈" required></textarea><button id="send" type="submit">전송</button></form>
<small>같은 PC에서 LM Studio와 FastAPI 서버가 실행 중이어야 합니다. 대화는 브라우저 메모리에만 보관합니다.</small></footer>
</div>
<script>
"use strict";
// The browser's localhost means the computer opening this GitHub Pages tab.
const API = "http://127.0.0.1:8000";
const $=id=>document.getElementById(id);
const chat=$("chat");let history=[],busy=false;
function show(role,value){const el=document.createElement("div");el.className="msg "+role;el.textContent=value;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
async function check(){
 $("status").textContent="로컬 서버 확인 중...";
 try{
  const r=await fetch(API+"/api/models",{signal:AbortSignal.timeout(10000)});
  if(!r.ok)throw Error("HTTP "+r.status);
  const d=await r.json();
  $("status").textContent=d.models?.length?"연결 성공 · "+d.models.join(", "):"모델이 없습니다.";
 }catch(e){$("status").textContent="연결 실패 · uvicorn 서버, LM Studio, CORS 설정을 확인하세요. ("+e.message+")"}
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();if(busy||!$("question").value.trim())return;
 const text=$("question").value.trim();const messages=[...history,{role:"user",content:text}];
 show("user",text);$("question").value="";const pending=show("ai","답변 생성 중...");
 busy=true;$("send").disabled=true;$("reset").disabled=true;
 try{
  const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  const d=await r.json();if(!r.ok)throw Error(d.detail||"HTTP "+r.status);
  const answer=typeof d.answer==="string"?d.answer:JSON.stringify(d.answer);
  pending.textContent=answer;history=[...messages,{role:"assistant",content:answer}];
 }catch(err){pending.textContent="오류: "+err.message}
 finally{busy=false;$("send").disabled=false;$("reset").disabled=false;chat.scrollTop=chat.scrollHeight;$("question").focus()}
});
$("question").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("form").requestSubmit()}});
$("check").addEventListener("click",check);
$("reset").addEventListener("click",()=>{if(busy)return;history=[];chat.replaceChildren();show("ai","새 대화를 시작합니다.")});
check();
</script>
</body></html>
