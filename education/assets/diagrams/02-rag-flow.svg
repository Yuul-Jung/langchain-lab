<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 638" width="760" height="638" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">구조도 ② RAG 질의응답 흐름</title><desc id="d">사용자 질문이 검색 처리(임베딩, kNN 검색, 상위 참고 문서)와 답변 생성(프롬프트 구성, DeepSeek, 웹 화면) 두 흐름으로 나뉜다.</desc><rect x="0.5" y="0.5" width="759" height="636" rx="22" fill="#fafcff" stroke="#dbe4ee"/><rect x="22.0" y="22.0" width="716.0" height="77.9" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="380.0" y="50.8" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">사용자 질문</text><text x="380.0" y="75.4" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">“모터가 과열될 때 점검할 사항은?”</text><line x1="380.0" y1="104.9" x2="380.0" y2="123.9" stroke="#253e65" stroke-width="2"/><path d="M374.0,121.9 L380.0,129.9 L386.0,121.9" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="133.9" width="350.0" height="359.7" rx="16" fill="#ffffff" stroke="#dbe4ee"/><text x="197.0" y="161.9" font-size="14.5" font-weight="700" fill="#253e65" text-anchor="middle">검색 처리</text><rect x="37.0" y="176.9" width="320.0" height="77.9" rx="14" fill="#e8f0ff" stroke="#c4d8fb"/><text x="197.0" y="205.7" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">Qwen3-Embedding-4B</text><text x="197.0" y="230.2" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">질문 → 2,560차원 벡터</text><line x1="197.0" y1="259.8" x2="197.0" y2="278.8" stroke="#253e65" stroke-width="2"/><path d="M191.0,276.8 L197.0,284.8 L203.0,276.8" fill="none" stroke="#253e65" stroke-width="2"/><rect x="37.0" y="288.8" width="320.0" height="77.9" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="197.0" y="317.6" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">Elasticsearch</text><text x="197.0" y="342.1" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">기존 인덱스에서 kNN 검색</text><line x1="197.0" y1="371.7" x2="19