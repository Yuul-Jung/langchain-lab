<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 623" width="760" height="623" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans KR','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">구조도 ⑤ 연결 오류 진단 절차</title><desc id="d">웹의 연결 실패를 /api/models 확인과 Elasticsearch 연결·인증 확인 두 판단으로 나누어 원인을 좁히고 최종 검증한다.</desc><rect x="0.5" y="0.5" width="759" height="622" rx="22" fill="#fafcff" stroke="#dbe4ee"/><rect x="22.0" y="22.0" width="716.0" height="77.9" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="380.0" y="50.8" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">웹에서 “연결되지 않음” 표시</text><text x="380.0" y="75.4" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">서버·모델·검색 엔진 문제를 분리한다</text><line x1="380.0" y1="104.9" x2="380.0" y2="123.9" stroke="#253e65" stroke-width="2"/><path d="M374.0,121.9 L380.0,129.9 L386.0,121.9" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="133.9" width="716.0" height="39.0" rx="12" fill="#fff5df" stroke="#ead7a1"/><text x="380.0" y="156.9" font-size="14.5" font-weight="700" fill="#172032" text-anchor="middle">① /api/models 응답 가능한가?</text><line x1="380.0" y1="177.9" x2="380.0" y2="196.9" stroke="#253e65" stroke-width="2"/><path d="M374.0,194.9 L380.0,202.9 L386.0,194.9" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="206.9" width="350.0" height="97.4" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="197.0" y="235.7" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">아니요</text><text x="197.0" y="260.3" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">FastAPI 상태·8000 포트 → LM Studio 1234 포트</text><text x="197.0" y="279.8" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">확인</text><rect x="388.0" y="206.9" width="350.0" height="97.4" rx="14" fill="#eff9f3" stroke="#cce8d8"/><text x="563.0" y="245.5" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">예</text><text x="563.0" y="270.0" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">② /api/rag/status 점검으로 이동</text><line x1="380.0" y1="309.3" x2="380.0" y2="328.3" stroke="#253e65" stroke-width="2"/><path d="M374.0,326.3 L380.0,334.3 L386.0,326.3" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="338.3" width="716.0" height="39.0" rx="12" fill="#fff5df" stroke="#ead7a1"/><text x="380.0" y="361.3" font-size="14.5" font-weight="700" fill="#172032" text-anchor="middle">② Elasticsearch 연결·인증 가능한가?</text><line x1="380.0" y1="382.4" x2="380.0" y2="401.4" stroke="#253e65" stroke-width="2"/><path d="M374.0,399.4 L380.0,407.4 L386.0,399.4" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="411.4" width="350.0" height="77.9" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="197.0" y="440.1" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">아니요</text><text x="197.0" y="464.7" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">9200 포트 · CA 인증서 · .env 비밀번호 확인</text><rect x="388.0" y="411.4" width="350.0" height="77.9" rx="14" fill="#eff9f3" stroke="#cce8d8"/><text x="563.0" y="440.1" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">예</text><text x="563.0" y="464.7" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">③ RAG 인덱스·임베딩 모델 확인</text><line x1="380.0" y1="494.2" x2="380.0" y2="513.2" stroke="#253e65" stroke-width="2"/><path d="M374.0,511.2 L380.0,519.2 L386.0,511.2" fill="none" stroke="#253e65" stroke-width="2"/><rect x="22.0" y="523.2" width="716.0" height="77.9" rx="14" fill="#e8f0ff" stroke="#c4d8fb"/><text x="380.0" y="552.0" font-size="16" font-weight="700" fill="#172032" text-anchor="middle">최종 검증</text><text x="380.0" y="576.6" font-size="13" font-weight="400" fill="#5c6c83" text-anchor="middle">문서 검색 → 답변 생성 → 출처 표시 → 오류 로그 확인</text></svg>
