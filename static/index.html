<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LangChain Lab · Local RAG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf2fa;font-family:system-ui,"Noto Sans KR",sans-serif}
main{max-width:1050px;margin:auto;height:100dvh;display:flex;flex-direction:column}
header,footer{padding:16px 22px;border-bottom:1px solid #31415a}footer{border-bottom:0;border-top:1px solid #31415a}
h1{margin:0;font-size:21px}small{color:#9cafc8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button,select,textarea{font:inherit;border-radius:9px}
button{background:#2563eb;color:white;padding:10px 15px;border:0;cursor:pointer}
button.secondary{background:#34445d}button:disabled{opacity:.55}
select,textarea{border:1px solid #475569;background:#1f2937;color:white;padding:10px}
#status{font-size:12px;color:#a5d0ff;margin-top:10px}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:13px;padding:20px}
.msg{max-width:88%;padding:13px 16px;border-radius:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#1d4ed8;align-self:flex-end}.assistant{background:#26364e;align-self:flex-start}
.sources{font-size:12px;color:#bac8dd;border-left:2px solid #64748b;padding:8px 12px;white-space:pre-wrap;align-self:flex-start;max-width:88%}
form{display:flex;gap:9px}textarea{flex:1;min-width:0;resize:none}footer small{display:block;margin-top:8px}
</style></head><body><main>
<header><h1>LangChain Lab</h1><small>FastAPI · LM Studio · Elasticsearch (로컬 통합 서비스)</small>
<div class="toolbar"><label for="mode">응답 모드</label>
<select id="mode"><option value="auto" selected>자동 (질문마다 판단)</option><option value="rag">문서만</option><option value="chat">일반만</option></select>
<label for="provider">모델</label><select id="provider"><option value="">기본 모델</option></select>
<a href="/documents" style="display:inline-block;padding:10px 14px;border-radius:9px;background:#34445d;color:white;text-decoration:none;font-size:15px">문서 업로드·관리</a>
<button id="check" class="secondary" type="button">연결 상태</button>
<button id="clear" class="secondary" type="button">새 대화</button></div>
<div id="status" role="status">서비스 상태 확인 중...</div><div id="providerNote" role="note" style="font-size:12px;color:#fcd34d;margin-top:4px"></div></header>
<section id="chat" aria-live="polite"><div class="msg assistant">질문을 입력하세요. 문서 검색은 RAG 모드를 선택합니다.</div></section>
<footer><form id="form"><textarea id="question" rows="2" required placeholder="질문 입력 · Enter 전송 / Shift+Enter 줄바꿈"></textarea><button id="send" type="submit">전송</button></form>
<small>현재 PC에서만 접속하는 개발용 서비스입니다. 대화 기록은 아직 영구 저장하지 않습니다.</small></footer>
</main><script>
"use strict";
// (추가) 로그인 세션이 만료되어 401 이 오면 로그인 페이지로 보낸다
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname)}return r}
const $=id=>document.getElementById(id), chat=$("chat");let history=[],busy=false;
function append(cls,value){const node=document.createElement("div");node.className=cls;node.textContent=value;chat.appendChild(node);chat.scrollTop=chat.scrollHeight;return node}
async function check(){
 $("status").textContent="연결 확인 중...";
 try{
  const [a,b]=await Promise.all([api("/api/models"),api("/api/rag/status")]);
  if(!a.ok)throw Error("LM Studio 연결 불가");
  const model=await a.json(),rag=await b.json();
  fillProviders(model);
  $("status").textContent="LLM: "+model.chat_model+" · Elasticsearch: "+(rag.connected?(rag.index_exists?"연결됨":"인덱스 없음"):("연결되지 않음 · "+(rag.reason||"설정 확인 필요")));
 }catch(e){$("status").textContent="서버 상태 확인 실패: "+e.message}
}
// (추가) 모델 제공자 목록: 키·모델이 설정된 것만 선택 가능, 이유는 마우스를 올리면 보임
function fillProviders(model){
 const sel=$("provider"),keep=sel.value;sel.replaceChildren();
 for(const p of model.providers||[]){
  const o=document.createElement("option");o.value=p.id;
  o.textContent=p.label+(p.model?" · "+p.model:"")+(p.ready?"":" (미설정)");
  o.disabled=!p.ready;if(!p.ready)o.title=p.reason||"";o.dataset.external=p.external?"1":"";
  sel.appendChild(o);
 }
 sel.value=keep||model.default_provider||"local";providerNote();
}
function providerNote(){
 const o=$("provider").selectedOptions[0];
 $("providerNote").textContent=o&&o.dataset.external?"외부 API 모델입니다. 질문 내용이 해당 회사 서버로 전송됩니다.":"";
}
$("provider").addEventListener("change",providerNote);
$("form").addEventListener("submit",async e=>{
 e.preventDefault();if(busy||!$("question").value.trim())return;
 const content=$("question").value.trim(),mode=$("mode").value;
 const messages=[...history,{role:"user",content}];
 append("msg user",content);$("question").value="";const result=append("msg assistant","답변 생성 중...");
 busy=true;$("send").disabled=true;$("clear").disabled=true;$("mode").disabled=true;$("provider").disabled=true;
 try{
  const r=await api("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,mode,provider:$("provider").value||null})});
  const data=await r.json();if(!r.ok)throw Error(data.detail||"API 오류");
  result.textContent=data.answer||"응답 없음";
  history=[...messages,{role:"assistant",content:data.answer||""}];
  // (추가) 어떤 방식으로 처리했는지 한 줄로 보여 준다. 자동 판단이 틀렸다면 "문서만"·"일반만"으로 고정해서 쓴다
  const ROUTE={documents:"문서 근거로 답함",library:"부품 라이브러리(KiCad 공식 심볼) 값으로 답함",general:"일반 대화로 답함 — 올려 둔 문서를 근거로 쓰지 않았습니다"};
  if(data.route){append("sources","처리 방식: "+(ROUTE[data.route]||data.route)+(data.route_note?"\n"+data.route_note:"")+(data.route==="documents"&&data.route_strength==="weak"?"\n문서와의 관련이 약합니다. 문서와 무관한 질문이면 위의 응답 모드를 '일반만'으로 바꿔 보세요.":""))}
  if(data.sources?.length){
   // (변경) 문서명·쪽 번호 표시, 긴 근거는 앞 300자만
   const text=data.sources.map((s,i)=>{const where=(s.filename||s.title||"문서")+(s.page?" · p."+s.page:"");const body=s.snippet||(s.text.length>300?s.text.slice(0,300)+"…":s.text);return "[자료 "+(i+1)+"] "+where+" · 점수 "+s.score+"\n"+body;}).join("\n\n");
   append("sources","검색 근거\n"+text);
  }
 }catch(err){result.textContent="오류: "+err.message}
 finally{busy=false;$("send").disabled=false;$("clear").disabled=false;$("mode").disabled=false;$("provider").disabled=false;chat.scrollTop=chat.scrollHeight}
});
$("question").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("form").requestSubmit()}});
$("mode").addEventListener("change",()=>{history=[];chat.replaceChildren();append("msg assistant","모드를 전환했습니다. 새 대화를 시작합니다.")});
$("clear").addEventListener("click",()=>{if(busy)return;history=[];chat.replaceChildren();append("msg assistant","새 대화를 시작합니다.")});
$("check").addEventListener("click",check);check();
</script></body></html>
