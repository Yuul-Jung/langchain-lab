name: Document Pipeline Tests

on:
  push:
    paths:
      - 'document_pipeline.py'
      - 'document_api.py'
      - 'app.py'
      - 'tests/test_document_pipeline.py'
      - 'tests/test_es_settings.py'
      - 'rag_search.py'
      - 'requirements.txt'
      - '.github/workflows/document-pipeline-tests.yml'
  workflow_dispatch:

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q app.py rag_search.py document_pipeline.py document_api.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
