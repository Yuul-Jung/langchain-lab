name: Document Pipeline Tests

on:
  push:
    paths:
      - 'document_pipeline.py'
      - 'document_api.py'
      - 'app.py'
      - 'tests/test_document_pipeline.py'
      - 'tests/test_es_settings.py'
      - 'rag_search.py'
      - 'vlm_ocr.py'
      - 'local_status.py'
      - 'tests/test_local_status.py'
      - 'tests/**'
      - 'settings.py'
      - 'llm_providers.py'
      - 'static/**'
      - 'index.html'
      - 'docs/**'
      - 'education/**'
      - 'README.md'
      - 'scripts/**'
      - 'tests/test_vlm_ocr.py'
      - 'requirements.txt'
      - '.github/workflows/document-pipeline-tests.yml'
  workflow_dispatch:

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q app.py rag_search.py document_pipeline.py document_api.py local_status.py vlm_ocr.py settings.py llm_providers.py scripts/vlm-analyze-pages.py scripts/compare-ocr-vlm.py scripts/check-links.py scripts/run-eval.py
      - name: Check shell script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check public site links (index.html, docs/, education/dist/, README)
        run: python scripts/check-links.py
